<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bài Giảng Công Nghệ - GV Gia Thoại</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .slide-active { display: flex !important; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .content-area { background: white; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 bg-slate-900 text-white flex flex-col shadow-2xl">
        <div class="p-6 border-b border-slate-700">
            <h1 class="text-xl font-bold text-blue-400 uppercase tracking-tight">E-Teaching</h1>
            <p class="text-[10px] text-slate-400 uppercase mt-1">Giảng dạy & Ôn tập trực tuyến</p>
        </div>

        <nav class="flex-1 p-4 overflow-y-auto space-y-6">
            <div>
                <p class="text-xs font-bold text-slate-500 uppercase mb-3 ml-2">Khối 10</p>
                <ul class="space-y-1">
                    <li onclick="loadLesson('k10b1')" class="p-2 text-sm hover:bg-slate-800 rounded cursor-pointer transition">Bài 1: KH, KT & Công nghệ</li>
                    <li onclick="loadLesson('k10b2')" class="p-2 text-sm hover:bg-slate-800 rounded cursor-pointer transition text-slate-400">Bài 2: Hệ thống kỹ thuật...</li>
                </ul>
            </div>
            <div>
                <p class="text-xs font-bold text-slate-500 uppercase mb-3 ml-2">Khối 11</p>
                <ul class="space-y-1">
                    <li onclick="loadLesson('k11b1')" class="p-2 text-sm hover:bg-slate-800 rounded cursor-pointer transition text-slate-400">Bài 1: Cơ khí chế tạo...</li>
                </ul>
            </div>
        </nav>
        <div class="p-4 text-[10px] text-slate-600 text-center border-t border-slate-800">GV. Gia Thoại © 2026</div>
    </aside>

    <main class="flex-1 flex flex-col p-6 overflow-hidden">
        <div class="flex justify-between items-center mb-4">
            <h2 id="current-lesson-title" class="text-xl font-semibold text-slate-700 italic">Chọn bài học từ menu bên trái</h2>
            <div class="flex gap-2">
                <button onclick="prevSlide()" class="p-2 bg-white border rounded-lg hover:bg-slate-50"><i class="fas fa-chevron-left"></i></button>
                <span id="slide-number" class="flex items-center px-4 bg-white border rounded-lg text-sm font-medium">0 / 0</span>
                <button onclick="nextSlide()" class="p-2 bg-white border rounded-lg hover:bg-slate-50"><i class="fas fa-chevron-right"></i></button>
                <button onclick="toggleFullScreen()" class="ml-4 p-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"><i class="fas fa-expand"></i></button>
            </div>
        </div>

        <div id="presentation-zone" class="content-area flex-1 flex flex-col relative overflow-hidden">
            <div class="flex flex-col items-center justify-center h-full text-slate-300">
                <i class="fas fa-chalkboard-teacher text-6xl mb-4"></i>
                <p>Sẵn sàng cho bài giảng hôm nay!</p>
            </div>
        </div>
    </main>

    <script>
        // DỮ LIỆU BÀI GIẢNG (Bạn thêm slide vào đây)
        const lessonData = {
            'k10b1': {
                title: "Bài 1: Khoa học, Kỹ thuật và Công nghệ",
                slides: [
                    { h: "Chào mừng các em!", p: "Hôm nay chúng ta sẽ tìm hiểu về mối quan hệ giữa KH - KT - CN.", img: "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=800&auto=format&fit=crop" },
                    { h: "1. Khoa học là gì?", p: "Là hệ thống tri thức về bản chất, quy luật tồn tại và phát triển của sự vật, hiện tượng tự nhiên, xã hội." },
                    { h: "2. Kỹ thuật là gì?", p: "Là việc ứng dụng các nguyên lý khoa học để thiết kế, chế tạo các giải pháp kỹ thuật phục vụ đời sống." },
                    { h: "3. Công nghệ là gì?", p: "Sử dụng các giải pháp kỹ thuật để thay đổi thế giới xung quanh, tạo ra các sản phẩm thực tế." },
                    { h: "Tổng kết", p: "KH (Biết gì) -> KT (Làm thế nào) -> CN (Làm bằng gì)." }
                ]
            }
            // Thêm các bài khác tương tự...
        };

        let currentSlides = [];
        let currentIndex = 0;

        function loadLesson(key) {
            const data = lessonData[key];
            if (!data) return;

            document.getElementById('current-lesson-title').innerText = data.title;
            currentSlides = data.slides;
            currentIndex = 0;
            renderSlides();
        }

        function renderSlides() {
            const zone = document.getElementById('presentation-zone');
            zone.innerHTML = ''; // Clear cũ

            currentSlides.forEach((slide, index) => {
                const div = document.createElement('div');
                div.className = `absolute inset-0 hidden flex-col items-center justify-center p-12 text-center ${index === currentIndex ? 'slide-active' : ''}`;
                
                let content = `<h2 class="text-4xl font-bold text-blue-600 mb-6">${slide.h}</h2>`;
                if(slide.img) content += `<img src="${slide.img}" class="w-1/2 rounded-xl mb-6 shadow-lg">`;
                content += `<p class="text-2xl text-slate-600 leading-relaxed max-w-3xl">${slide.p}</p>`;
                
                div.innerHTML = content;
                zone.appendChild(div);
            });

            updateCounter();
        }

        function nextSlide() {
            if (currentIndex < currentSlides.length - 1) {
                currentIndex++;
                renderSlides();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                renderSlides();
            }
        }

        function updateCounter() {
            document.getElementById('slide-number').innerText = `${currentIndex + 1} / ${currentSlides.length}`;
        }

        function toggleFullScreen() {
            const elem = document.getElementById('presentation-zone');
            if (elem.requestFullscreen) elem.requestFullscreen();
        }

        // Hỗ trợ phím mũi tên
        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextSlide();
            if (e.key === "ArrowLeft") prevSlide();
        });
    </script>
</body>
</html>
